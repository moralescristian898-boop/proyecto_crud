<!DOCTYPE html>
<html lang="es">
<head><meta charset="UTF-8"><title>Editar Producto</title></head>
<body>
    <h1>Editar producto #{{ producto.id }}</h1>

    <form action="/actualizar/{{ producto.id }}" method="POST">
       <label>Nombre:</label><br>
        <input type="text" name="nombre" value="{{ producto.nombre }}" required><br><br>

       <label>Precio:</label><br>
        <input type="number" name="precio" step="0.01" min="0"
               value="{{ producto.precio }}" required><br><br>

       <label>Cantidad:</label><br>
        <input type="number" name="cantidad" min="1"
               value="{{ producto.cantidad }}" required><br><br>

        <button type="submit">Actualizar</button>
        <a href="/productos">Cancelar</a>
    </form>
</body>
</html>
